name: Build Check

# 每个 PR 和 main 上的推送都做一次「能不能编译 + 测试过不过」。
# runner 是 macOS，因为这是个 AppKit 应用，Linux 上连 import 都过不去。
#
# 注意：GitHub 的 macOS runner 自带完整 Xcode，和本地「只有 CLT」不同，
# 所以这里的构建用的是同一份 build.sh——如果它依赖了只有 CLT 才有的行为，
# 这里会立刻暴露。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # 说明：macos-14 在某些仓库会解析到不支持的 macos-14-arm64-us-default，
    # 用 macos-latest 更稳（当前映射到 macOS 15）。
    # 本地开发机是 macOS 26，构建脚本用显式 -target 保证最低版本兼容。
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version || true

      - name: Build
        run: ./app/build.sh release

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP=app/build/better-macOS.app
          test -d "$APP" || { echo "no app bundle"; exit 1; }
          test -x "$APP/Contents/MacOS/better-macOS" || { echo "no executable"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "no Info.plist"; exit 1; }
          echo "--- Info.plist ---"
          plutil -p "$APP/Contents/Info.plist"
          echo "--- signature ---"
          codesign -dv "$APP" 2>&1 | head -5
          echo "--- size ---"
          du -sh "$APP"
          # LSUIElement 必须是 true，否则会冒出 Dock 图标
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist")" = "true" \
            || { echo "LSUIElement must be true"; exit 1; }

          # 图标资源：CFBundleIconFile 指的文件必须真的在包里，否则 Finder/Dock
          # 会静默退回默认图标——这类回归不会让任何测试变红，只能在打包后查。
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")"
          test -n "$ICON_NAME" || { echo "CFBundleIconFile is empty"; exit 1; }
          test -f "$APP/Contents/Resources/${ICON_NAME}.icns" \
            || { echo "missing AppIcon: ${ICON_NAME}.icns"; exit 1; }
          for f in MenuBarIcon.png MenuBarIcon@2x.png; do
            test -f "$APP/Contents/Resources/$f" || { echo "missing $f"; exit 1; }
          done
          echo "--- icons ---"
          ls -lh "$APP/Contents/Resources"
          # 菜单栏图必须是模板图可用形态：有 alpha 通道、而且不是全不透明
          python3 - "$APP/Contents/Resources/MenuBarIcon@2x.png" <<'PY'
          import struct, sys, zlib
          p = sys.argv[1]
          d = open(p, 'rb').read()
          assert d[:8] == b'\x89PNG\r\n\x1a\n', "not a PNG"
          w, h = struct.unpack('>II', d[16:24])
          bitdepth, colortype = d[24], d[25]
          assert colortype == 6, f"menu bar icon must be RGBA, got colortype {colortype}"
          print(f"menu bar icon {w}x{h} RGBA bitdepth={bitdepth}")
          PY

      - name: Self tests
        run: ./app/test.sh

      # 点击教练的可执行断言：--click-at 在无菜单展开时应正常退出（非零也算通过，
      # 因为「这里没有可教的快捷键」本身就是合法结论）。这一步真正防的是：
      # 入口被误放到 NSApplication 初始化之后 → 进程挂进事件循环不退出。
      - name: Click coach probe entry
        run: |
          set -euo pipefail
          BIN=app/build/better-macOS.app/Contents/MacOS/better-macOS
          # 10 秒硬超时：正常应在毫秒级返回
          OUT=$( ( "$BIN" --click-at 5 5 2>&1 || true ) & CPID=$!
                 ( sleep 10; kill -9 $CPID 2>/dev/null ) & WPID=$!
                 wait $CPID 2>/dev/null || true
                 kill $WPID 2>/dev/null || true )
          echo "$OUT"
          echo "$OUT" | grep -q "CLICK-AT" || { echo "✗ --click-at 没有输出判定结果（可能挂住了）"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-macOS-app
          path: app/build/better-macOS.app
          retention-days: 7
